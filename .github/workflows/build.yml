# Builds the private cear12/oleaibuddy-git on this public repo's free Actions minutes
# (same scheme as cear12/olediskbuddy-releases).
#   Actions -> Build -> Run workflow. Needs the secret SOURCE_TOKEN: a fine-grained PAT with
#   Contents: read on cear12/oleaibuddy-git. With "publish" ticked and a version set it creates
#   Release vX.Y.Z here. Only built packages are uploaded; the source never is.
# Publishing also needs the repository variable OLEAI_LICENSE_PUBKEY (production Ed25519 public
# key, hex). Optional signing secrets are the same as in the source repo's docs/RELEASE.md.
# Source of truth: packaging/releases-repo/ in cear12/oleaibuddy-git (scripts/sync_releases_repo.ps1).
name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Product version X.Y.Z (empty = version from CMakeLists.txt)"
        required: false
        default: ""
      ref:
        description: "Branch, tag or SHA of cear12/oleaibuddy-git (empty = default branch)"
        required: false
        default: ""
      publish:
        description: "Also publish a GitHub Release here (needs an explicit version X.Y.Z)"
        type: boolean
        required: false
        default: false
      android:
        description: "Also build Android (arm64 APK; AAB when release-signed)"
        type: boolean
        required: false
        default: false
      msi:
        description: "Also build the Windows MSI"
        type: boolean
        required: false
        default: false
      onnx:
        description: "Build the ONNX Runtime backend (Windows downloads the official release)"
        type: boolean
        required: false
        default: false
      cmake_args:
        description: "Extra CMake arguments for all platforms (e.g. -DOLEAI_LLAMA_VULKAN=ON)"
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  QT_VERSION: "6.11.*"
  VCPKG_COMMIT: 40dd49b0c9c7dbd79dc64cad5e82308eae04f67f   # = builtin-baseline in vcpkg.json
  # See ci.yml: aqtinstall master is needed for Qt 6.11's Windows repository layout.
  AQT_SOURCE_WINDOWS: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
  WIX_VERSION: "5.0.2"
  OLEAI_WITH_LLAMA: "ON"
  # OPTIONAL ONNX Runtime backend (backends/onnx). "OFF" keeps the jobs as they are; set "ON" to
  # download the official prebuilt release on Windows (ONNXRUNTIME_ROOT) and build the backend.
  # Elsewhere ON means AUTO: the backend is built only when the runner has ONNX Runtime.
  OLEAI_WITH_ONNX: ${{ inputs.onnx && 'ON' || 'OFF' }}
  ONNXRUNTIME_VERSION: "1.22.0"
  EXTRA_CMAKE_ARGS: ${{ inputs.cmake_args }}
  SOURCE_REPO: cear12/oleaibuddy-git

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      cmake_arg: ${{ steps.v.outputs.cmake_arg }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          # Ed25519 public key for Pro licence keys (repository variable, not a secret; docs/RELEASE.md).
          LICENSE_PUBKEY: ${{ vars.OLEAI_LICENSE_PUBKEY }}
        run: |
          v="$INPUT_VERSION"; publish="${INPUT_PUBLISH:-false}"
          if [[ "$publish" == "true" && -z "$v" ]]; then
            echo "::error::Publishing needs an explicit version X.Y.Z"; exit 1
          fi
          if [[ -n "$v" && ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$v' is not X.Y.Z (tags must look like v1.2.3)"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          args=""
          if [[ -n "$v" ]]; then args="-DOLEAI_VERSION=$v"; fi
          if [[ -n "$LICENSE_PUBKEY" ]]; then
            args="$args -DOLEAI_LICENSE_PUBKEY=$LICENSE_PUBKEY"
          elif [[ "$publish" == "true" ]]; then
            echo "::error::Set the repository variable OLEAI_LICENSE_PUBKEY (production licence public key) before publishing"; exit 1
          fi
          # Licences cover builds released up to their updatesUntil date: stamp the release day.
          args="$args -DOLEAI_RELEASE_DATE=$(date -u +%F)"
          echo "cmake_arg=$args" >> "$GITHUB_OUTPUT"
          echo "Version: ${v:-<from CMakeLists.txt>}, publish: $publish"

  windows:
    needs: version
    defaults:
      run:
        working-directory: src
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-bincache
      BUILD_DIR: build/windows-release
      WITH_MSI: ${{ inputs.msi }}
      HAS_AZURE_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_SIGNING_ENDPOINT != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: lukka/get-cmake@v4.3.4
      - uses: jurplel/install-qt-action@v4
        env:
          AQT_CONFIG: ${{ github.workspace }}/src/.github/qt-settings.ini
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          aqtsource: ${{ env.AQT_SOURCE_WINDOWS }}
          modules: qtshadertools
          cache: true
          extra: --base https://qt.mirror.constant.com/
      - name: Installer tools (Inno Setup 6, WiX)
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            foreach ($dir in @("${env:ProgramFiles(x86)}\Inno Setup 6", "$env:ProgramFiles\Inno Setup 6")) {
              if (Test-Path (Join-Path $dir "ISCC.exe")) { $iscc = $dir; break }
            }
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed ($LASTEXITCODE)" }
          }
          if ($env:WITH_MSI -eq "true") {
            dotnet tool install --global wix --version $env:WIX_VERSION
            if ($LASTEXITCODE -ne 0) { throw "dotnet tool install wix failed ($LASTEXITCODE)" }
            "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      - name: Create vcpkg binary cache dir
        shell: bash
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - uses: actions/cache@v6
        with:
          path: .vcpkg-bincache
          key: vcpkg-windows-x64-${{ env.VCPKG_COMMIT }}-${{ hashFiles('src/vcpkg.json') }}
          restore-keys: vcpkg-windows-x64-${{ env.VCPKG_COMMIT }}-
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
      # ---- OPTIONAL: ONNX Runtime backend (only when env OLEAI_WITH_ONNX == 'ON') -------------
      # Official prebuilt release zip (include/, lib/onnxruntime.dll + .lib) -> ONNXRUNTIME_ROOT,
      # picked up by scripts/ci/feature-args.sh. The DLL is copied next to the executables at
      # build time and installed into bin/ (backends/onnx/CMakeLists.txt).
      - name: ONNX Runtime (optional)
        if: env.OLEAI_WITH_ONNX == 'ON' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = $env:ONNXRUNTIME_VERSION
          $zip = Join-Path $env:RUNNER_TEMP "onnxruntime-win-x64-$ver.zip"
          Invoke-WebRequest -Uri "https://github.com/microsoft/onnxruntime/releases/download/v$ver/onnxruntime-win-x64-$ver.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          "ONNXRUNTIME_ROOT=$env:RUNNER_TEMP\onnxruntime-win-x64-$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Feature arguments
        shell: bash
        run: echo "OLEAI_CMAKE_ARGS=$(bash scripts/ci/feature-args.sh) ${{ needs.version.outputs.cmake_arg }}" >> "$GITHUB_ENV"
      - name: Configure
        shell: pwsh
        run: |
          $extra = @($env:OLEAI_CMAKE_ARGS -split '\s+' | Where-Object { $_ })
          cmake --preset windows-release @extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --parallel
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: ctest --test-dir ${{ env.BUILD_DIR }} --output-on-failure --no-tests=error --timeout 900
      - name: Stage (install, deploy, smoke test)
        shell: pwsh
        run: .\packaging\windows\package.ps1 -BuildDir $env:BUILD_DIR -Phase Stage
      - name: Sign the executables (Azure Trusted Signing)
        if: env.HAS_AZURE_SIGNING == 'true'
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          files: |
            ${{ runner.temp }}\oai-stage\bin\OleAIBuddy.exe
            ${{ runner.temp }}\oai-stage\bin\oleai-bench.exe
          file-digest: SHA256
          timestamp-digest: SHA256
      - name: Package (portable ZIP, Setup.exe, MSI)
        shell: pwsh
        run: |
          $pkg = @{ BuildDir = $env:BUILD_DIR; OutputDir = "artifacts"; Phase = "Package" }
          if ($env:WITH_MSI -eq "true") { $pkg.WithMsi = $true }
          .\packaging\windows\package.ps1 @pkg
      - name: Sign the installers (Azure Trusted Signing)
        if: env.HAS_AZURE_SIGNING == 'true'
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\src\artifacts
          files-folder-filter: exe,msi
          file-digest: SHA256
          timestamp-digest: SHA256
      - name: Smoke-test the Setup.exe (silent per-user install, launch, uninstall)
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts -Filter "OleAIBuddy-*-windows-x64-Setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "Setup.exe was not produced" }
          $p = Start-Process -FilePath $setup.FullName -Wait -PassThru `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER")
          if ($p.ExitCode -ne 0) { throw "Setup.exe exited with $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Ole AI Buddy"
          $exe = Join-Path $dir "bin\OleAIBuddy.exe"
          if (-not (Test-Path $exe)) { throw "OleAIBuddy.exe was not installed to $dir\bin" }
          $p = Start-Process -FilePath (Join-Path $dir "bin\oleai-bench.exe") -ArgumentList "--help" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "installed oleai-bench --help failed ($($p.ExitCode))" }
          Start-Process -FilePath (Join-Path $dir "unins000.exe") -Wait `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/PURGEDATA")
          # The uninstaller re-launches itself from %TEMP% and returns at once: wait for it.
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw "Uninstall did not remove OleAIBuddy.exe" }
      - uses: actions/upload-artifact@v7
        with:
          name: package-windows
          path: |
            src/artifacts/OleAIBuddy-*-windows-x64-Setup.exe
            src/artifacts/OleAIBuddy-*-windows-x64-portable.zip
            src/artifacts/OleAIBuddy-*-windows-x64.msi
          if-no-files-found: error

  linux:
    needs: version
    defaults:
      run:
        working-directory: src
    # The AppImage runs on distributions with this glibc (2.39) or newer.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-bincache
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          persist-credentials: false
      - name: Linux packages (Qt runtime, AppImage tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf libfuse2t64 file \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3
      - uses: lukka/get-cmake@v4.3.4
      - uses: jurplel/install-qt-action@v4
        env:
          AQT_CONFIG: ${{ github.workspace }}/src/.github/qt-settings.ini
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          modules: qtshadertools
          cache: true
          extra: --base https://qt.mirror.constant.com/
      - name: Create vcpkg binary cache dir
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - uses: actions/cache@v6
        with:
          path: .vcpkg-bincache
          key: vcpkg-linux-x86_64-${{ env.VCPKG_COMMIT }}-${{ hashFiles('src/vcpkg.json') }}
          restore-keys: vcpkg-linux-x86_64-${{ env.VCPKG_COMMIT }}-
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
      - name: Configure
        run: |
          # shellcheck disable=SC2046  # feature-args.sh prints a list of arguments
          cmake --preset unix-release -DVCPKG_TARGET_TRIPLET=x64-linux \
            $(bash scripts/ci/feature-args.sh) ${{ needs.version.outputs.cmake_arg }}
      - name: Build
        run: cmake --build build/unix-release --parallel
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: ctest --test-dir build/unix-release --output-on-failure --no-tests=error --timeout 900
      - name: AppImage + tar.gz (smoke-tests the AppDir)
        run: bash packaging/linux/package.sh build/unix-release artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: package-linux
          path: |
            src/artifacts/OleAIBuddy-*-linux-x86_64.AppImage
            src/artifacts/OleAIBuddy-*-linux-x86_64.tar.gz
          if-no-files-found: error

  macos:
    needs: version
    defaults:
      run:
        working-directory: src
    runs-on: macos-15   # Apple Silicon
    timeout-minutes: 150
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-bincache
      HAS_MACOS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
      NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          persist-credentials: false
      - uses: lukka/get-cmake@v4.3.4
      - uses: jurplel/install-qt-action@v4
        env:
          AQT_CONFIG: ${{ github.workspace }}/src/.github/qt-settings.ini
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          modules: qtshadertools
          cache: true
          extra: --base https://qt.mirror.constant.com/
      - name: Create vcpkg binary cache dir
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - uses: actions/cache@v6
        with:
          path: .vcpkg-bincache
          key: vcpkg-macos-arm64-${{ env.VCPKG_COMMIT }}-${{ hashFiles('src/vcpkg.json') }}
          restore-keys: vcpkg-macos-arm64-${{ env.VCPKG_COMMIT }}-
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
      - name: Configure
        run: |
          # shellcheck disable=SC2046  # feature-args.sh prints a list of arguments
          cmake --preset unix-release -DVCPKG_TARGET_TRIPLET=arm64-osx -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 \
            $(bash scripts/ci/feature-args.sh) ${{ needs.version.outputs.cmake_arg }}
      - name: Build
        run: cmake --build build/unix-release --parallel
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/unix-release --output-on-failure --no-tests=error --timeout 900
      - name: Import the Developer ID certificate
        if: env.HAS_MACOS_CERT == 'true'
        uses: apple-actions/import-codesign-certs@v5
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      - name: Notary API key
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
        run: |
          if [[ -n "$NOTARY_API_KEY" ]]; then
            printf '%s' "$NOTARY_API_KEY" > "$RUNNER_TEMP/notary.p8"
            echo "NOTARY_API_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          fi
      - name: DMG (deploy, sign, smoke test, notarize when configured)
        run: bash packaging/macos/package.sh build/unix-release artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: package-macos
          path: src/artifacts/OleAIBuddy-*-macos-*.dmg
          if-no-files-found: error

  android:
    if: inputs.android
    needs: version
    defaults:
      run:
        working-directory: src
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-bincache
      ANDROID_NDK_VERSION: "27.2.12479018"   # r27c, the NDK of Qt 6.11
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          persist-credentials: false
      - uses: lukka/get-cmake@v4.3.4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK + NDK r27c
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [[ ! -d "$sdk/ndk/$ANDROID_NDK_VERSION" ]]; then
            yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" > /dev/null
          fi
          {
            echo "ANDROID_SDK_ROOT=$sdk"
            echo "ANDROID_NDK_ROOT=$sdk/ndk/$ANDROID_NDK_VERSION"
            echo "ANDROID_NDK_HOME=$sdk/ndk/$ANDROID_NDK_VERSION"
          } >> "$GITHUB_ENV"
      - name: Qt (host, linux_gcc_64)
        uses: jurplel/install-qt-action@v4
        env:
          AQT_CONFIG: ${{ github.workspace }}/src/.github/qt-settings.ini
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          modules: qtshadertools
          cache: true
          extra: --base https://qt.mirror.constant.com/
      - name: Remember the host Qt
        run: echo "QT_HOST_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"
      - name: Qt (android_arm64_v8a)
        uses: jurplel/install-qt-action@v4
        env:
          AQT_CONFIG: ${{ github.workspace }}/src/.github/qt-settings.ini
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: qtshadertools
          cache: true
          extra: --base https://qt.mirror.constant.com/
      - name: Remember the Android Qt
        run: echo "QT_ANDROID_ROOT=$QT_ROOT_DIR" >> "$GITHUB_ENV"
      - name: Create vcpkg binary cache dir
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - uses: actions/cache@v6
        with:
          path: .vcpkg-bincache
          key: vcpkg-android-arm64-${{ env.VCPKG_COMMIT }}-${{ hashFiles('src/vcpkg.json') }}
          restore-keys: vcpkg-android-arm64-${{ env.VCPKG_COMMIT }}-
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
      - name: Keystore (release secrets, else a generated debug keystore)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ "$HAS_ANDROID_KEYSTORE" == "true" ]]; then
            ks="$RUNNER_TEMP/release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ks"
            {
              echo "QT_ANDROID_KEYSTORE_PATH=$ks"
              echo "QT_ANDROID_KEYSTORE_ALIAS=$ANDROID_KEY_ALIAS"
              echo "QT_ANDROID_KEYSTORE_STORE_PASS=$ANDROID_KEYSTORE_PASSWORD"
              echo "QT_ANDROID_KEYSTORE_KEY_PASS=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "Signing with the release keystore (alias $ANDROID_KEY_ALIAS)"
          else
            ks="$HOME/.android/debug.keystore"
            if [[ ! -f "$ks" ]]; then
              mkdir -p "$HOME/.android"
              keytool -genkeypair -keystore "$ks" -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
            {
              echo "QT_ANDROID_KEYSTORE_PATH=$ks"
              echo "QT_ANDROID_KEYSTORE_ALIAS=androiddebugkey"
              echo "QT_ANDROID_KEYSTORE_STORE_PASS=android"
              echo "QT_ANDROID_KEYSTORE_KEY_PASS=android"
            } >> "$GITHUB_ENV"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: publishing a debug-signed APK only (no AAB)"
          fi
      - name: Configure
        run: |
          sign="-DQT_ANDROID_SIGN_APK=ON"
          if [[ "$HAS_ANDROID_KEYSTORE" == "true" ]]; then sign="$sign -DQT_ANDROID_SIGN_AAB=ON"; fi
          # shellcheck disable=SC2046,SC2086  # feature-args.sh / $sign are lists of arguments
          cmake --preset android-arm64 $sign $(bash scripts/ci/feature-args.sh) -DOLEAI_WITH_ONNX=OFF \
            ${{ needs.version.outputs.cmake_arg }}
      - name: Build + package (APK, AAB when release-signed)
        run: |
          if [[ "$HAS_ANDROID_KEYSTORE" == "true" ]]; then
            bash packaging/android/package.sh build/android-arm64 artifacts --aab
          else
            bash packaging/android/package.sh build/android-arm64 artifacts
          fi
          rm -f "$RUNNER_TEMP/release.keystore"
      - uses: actions/upload-artifact@v7
        with:
          name: package-android
          path: |
            src/artifacts/OleAIBuddy-*-android-arm64.apk
            src/artifacts/OleAIBuddy-*-android-arm64.aab
          if-no-files-found: error

  publish:
    # Android is optional: a skipped Android job does not block the release.
    if: >-
      !cancelled() && needs.version.outputs.publish == 'true' &&
      needs.windows.result == 'success' && needs.linux.result == 'success' &&
      needs.macos.result == 'success' &&
      (needs.android.result == 'success' || needs.android.result == 'skipped')
    needs: [version, windows, linux, macos, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Stable-name copies, SHA256SUMS.txt, latest.json
        working-directory: dist
        run: |
          export RELEASE_BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/"
          # "OleAIBuddy-1.2.3-windows-x64-Setup.exe" -> "OleAIBuddy-windows-x64-Setup.exe", so
          # .../releases/latest/download/<stable name> always serves the newest build.
          for f in OleAIBuddy-"$VERSION"-*; do cp "$f" "${f/-$VERSION-/-}"; done
          sha256sum OleAIBuddy-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          python3 - <<'PY'
          import datetime, hashlib, json, os
          v = os.environ["VERSION"]
          base = os.environ["RELEASE_BASE"]
          def platform(name):
              for p in ("windows", "linux", "macos", "android"):
                  if f"-{p}-" in name:
                      return p
              return ""
          files = {}
          for n in sorted(os.listdir(".")):
              if n.startswith("OleAIBuddy-") and f"-{v}-" not in n:
                  h = hashlib.sha256(open(n, "rb").read()).hexdigest()
                  files[n] = {"url": base + n, "sha256": h, "size": os.path.getsize(n), "platform": platform(n)}
          date = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          json.dump({"version": v, "date": date, "files": files}, open("latest.json", "w"), indent=2)
          PY
          cat latest.json
      - uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Ole AI Buddy ${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: dist/*
          fail_on_unmatched_files: true
